<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ site.title }}</title>
  <meta name="description" content="Work in progress.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: #0e0f11;
      color: #a1a1aa;
      line-height: 1.6;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      -webkit-font-smoothing: antialiased;
    }
    .wrap { max-width: 560px; }
    .name {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.875rem;
      font-weight: 500;
      color: #7eb8f7;
      margin-bottom: 1rem;
    }
    h1 {
      font-size: 2.5rem;
      font-weight: 700;
      line-height: 1.2;
      color: #fafafa;
      margin-bottom: 1rem;
    }
    p { font-size: 1.0625rem; }
    a { color: #7eb8f7; text-decoration: none; }
    a:hover { text-decoration: underline; }
    @media (max-width: 640px) { h1 { font-size: 1.75rem; } }
  </style>
</head>
<body>
  <main class="wrap">
    {{ content }}
  </main>
</body>
</html>
